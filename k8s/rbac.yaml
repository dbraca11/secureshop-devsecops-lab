apiVersion: v1
kind: Namespace
metadata:
  name: secureshop
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: "latest"
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: "latest"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secureshop-dev
  namespace: secureshop
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secureshop-deployer
  namespace: secureshop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: secureshop
  name: developer-role
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "services", "deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods-global
  namespace: secureshop
subjects:
- kind: ServiceAccount
  name: secureshop-dev
  namespace: secureshop
roleRef:
  kind: Role
  name: developer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: secureshop
  name: deployer-role
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "services", "deployments", "replicasets"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-binding
  namespace: secureshop
subjects:
- kind: ServiceAccount
  name: secureshop-deployer
  namespace: secureshop
roleRef:
  kind: Role
  name: deployer-role
  apiGroup: rbac.authorization.k8s.io
