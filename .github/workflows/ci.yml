name: CI/CD Pipeline with SAST, SCA & Container Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast-sca-trivy-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@0b926109e5110ea933179fe530c00828574fe3c8
        with:
          python-version: '3.11'

      - name: Install dependencies & Run Tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx -r requirements.txt || pip install pytest httpx
          PYTHONPATH=. pytest

      - name: SonarCloud Scan (SAST)
        uses: SonarSource/sonarcloud-github-action@cb253f86e3314841d1ebc96b758652d2f70b925f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Snyk Security Scan (SCA)
        uses: snyk/actions/python-3.10@b016e7925e510ed97c3fb3c6d66e5f336a7155ec
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/secureshop:${{ github.sha }} .

      - name: Trivy Vulnerability Scan (Container Security)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394d2dd8c87dbb9
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/secureshop:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image to GHCR
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/secureshop:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/secureshop:latest
          docker push ghcr.io/${{ github.repository_owner }}/secureshop:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/secureshop:latest
