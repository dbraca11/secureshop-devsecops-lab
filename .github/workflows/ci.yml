name: CI/CD Pipeline with SAST, SCA & Container Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast-sca-trivy-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & Run Tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
          PYTHONPATH=. pytest

      - name: SonarCloud Scan (SAST)
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Snyk Security Scan (SCA)
        uses: snyk/actions/python-3.10@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/secureshop:${{ github.sha }} .

      - name: Verify installed packages
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/secureshop:${{ github.sha }} \
            python -m pip show setuptools msgpack

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/secureshop:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          skip-files: "**/pip/_vendor/bom.cdx.json"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/secureshop:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/secureshop:latest
          docker push ghcr.io/${{ github.repository_owner }}/secureshop:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/secureshop:latest
